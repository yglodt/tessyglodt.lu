# http://docs.spring.io/spring-boot/docs/current/reference/html/boot-features-external-config.html
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html

spring.application.name=tessyglodt.lu
server.servlet.session.timeout=3600s

server.port=8080
# server.use-forward-headers=true

#spring.cache.type=simple
#spring.cache.cache-names=page,accessInfo

spring.jmx.enabled=false

spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/tessyglodt
spring.datasource.username=tessyglodt
spring.datasource.password=tessyglodt


spring.web.locale=lb
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

logging.level.lu.tessyglodt.site=INFO

spring.security.user.name=admin
spring.security.user.password=password
spring.security.user.roles=ADMIN

spring.thymeleaf.mode=HTML
# Template caching stays on in production; spring-boot-devtools turns it off during development
#spring.resources.cache-period=86400

# http://docs.spring.io/spring-boot/docs/current/reference/html/boot-features-developing-web-applications.html#boot-features-spring-mvc-static-content
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
