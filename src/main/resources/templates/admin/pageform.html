<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
<title>Säiteneditor</title>
</head>
<th:block layout:fragment="content">

	<link rel="stylesheet" th:href="@{/css/bootstrap.css}">
	<link rel="stylesheet" th:href="@{/css/bootstrap-theme.css}">

	<script th:src="@{/js/jquery.min.js}"></script>
	<!-- The content-hashed file name hides CKEditor's own location from it -->
	<script th:inline="javascript">window.CKEDITOR_BASEPATH = /*[[@{/ckeditor/}]]*/ "/ckeditor/";</script>
	<script th:src="@{/ckeditor/ckeditor.js}"></script>

	<div class="box margin-top margin-bottom">
		<div>

			<form th:object="${page}" method="post" th:action="@{/admin/pageform}" class="form-horizontal">

				<input type="hidden" name="id" th:value="${page.id}">

				<div class="form-group">
					<label class="col-sm-2 control-label" for="name">Numm (fr)</label>
					<div class="col-sm-2">
						<input name="name" id="name" th:errorclass="errors" class="form-control" th:value="${page.name}">
					</div>
					<label class="col-sm-2 control-label" for="title">Titel</label>
					<div class="col-sm-2">
						<input name="title" id="title" th:errorclass="errors" class="form-control" th:value="${page.title}">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-2 control-label" for="latitude">Latitude</label>
					<div class="col-sm-2">
						<input name="latitude" id="latitude" th:errorclass="errors" class="form-control" type="number" step="0.0000001" min="45" max="55" th:value="${page.latitude}">
					</div>
					<label class="col-sm-2 control-label" for="longitude">Longitude</label>
					<div class="col-sm-2">
						<input name="longitude" id="longitude" th:errorclass="errors" class="form-control" type="number" step="0.0000001" min="5" max="8" th:value="${page.longitude}">
					</div>
				</div>

				<div class="form-group">
					<label class="col-sm-2 control-label" for="municipality">Gemeng / Kanton / Distrikt</label>
					<div class="col-sm-2">
						<select name="municipality" id="municipality" class="form-control" th:errorclass="errors">
							<option value="">[...]</option>
							<option th:each="item : ${municipalities}" th:value="${item.id}" th:text="${item.fullName}" th:selected="${item.id == page.municipality?.id}"></option>
						</select>
					</div>
					<label class="col-sm-2 control-label" for="datePublished">Publizéiert</label>
					<div class="col-sm-2">
						<input name="datePublished" id="datePublished" th:errorclass="errors" class="form-control" type="date" th:value="${page.datePublished}">
					</div>
					<label class="col-sm-2 control-label" for="published">Siichtbar</label>
					<div class="col-sm-2">
						<input type="checkbox" name="published" id="published" th:checked="${page.published}">
						<!-- Spring sets "published" to false when the unchecked box sends nothing -->
						<input type="hidden" name="_published" value="on">
					</div>
				</div>

				<hr>

				<div class="form-group">
					<div class="col-xs-12">
						<textarea name="content" id="content" class="form-control" th:errorclass="errors" th:text="${page.content}"></textarea>
					</div>
				</div>

				<div class="form-group">
					<div class="col-xs-offset-2 col-xs-5">
						<button type="submit" class="btn btn-primary">Späicheren</button>
					</div>
				</div>
			</form>

		</div>
	</div>

	<script>
		$(document).ready(function() {
			CKEDITOR.replace("content", {
				extraPlugins : "autogrow",
				allowedContent : true
			});
		});
	</script>

</th:block>
</html>
