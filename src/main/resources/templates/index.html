<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
<title>En Tour duerch d'Lëtzebuerger Land mam Tessy Glodt</title>
</head>
<main layout:fragment="content" class="home">

	<section class="feature" th:replace="~{fragments/randomPage}"></section>

	<aside class="marginalia shelf">
		<section class="mapthumb">
			<h3>Kaart</h3>
			<a th:href="@{/kaart}"><img th:src="@{/img/kaart.jpg}" width="300" height="164" alt="Kaart mat den Uertschaften"></a>
		</section>
		<section th:replace="~{fragments/newestPages}"></section>
		<section th:replace="~{fragments/lastReadPages}"></section>
		<section th:replace="~{fragments/mostReadPages}"></section>
		<section th:replace="~{fragments/districts}"></section>
		<section th:replace="~{fragments/cantons}"></section>
	</aside>

	<article class="register">
		<h2>All d’Texter</h2>
		<nav class="alphabet" aria-label="Alphabet">
			<a th:each="entry : ${pagesByInitial}" th:href="${'#' + entry.key}" th:text="${entry.key}"></a>
		</nav>
		<div class="register-body">
			<section th:each="entry : ${pagesByInitial}">
				<h3 th:id="${entry.key}" th:text="${entry.key}"></h3>
				<ul>
					<li th:each="page : ${entry.value}"><a th:href="@{/page/{p}(p=${page.name})}" th:text="${page.title}"></a></li>
				</ul>
			</section>
		</div>
	</article>
</main>
</html>
