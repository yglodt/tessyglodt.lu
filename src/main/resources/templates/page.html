<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/layout}">
<head>
<title th:text="${page.title}"></title>
<meta property="og:type" content="article">
<meta property="og:site_name" content="Kierchtuermspromenaden">
<meta property="og:title" th:content="${page.title}">
<meta property="og:description" th:content="${page.teaser}">
<meta property="og:url" th:content="${page.url}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
</head>
<main layout:fragment="content" class="page">
	<div class="with-margin">

		<article class="chapter">
			<header class="chapter-head">
				<p class="kicker" th:text="${'Kanton ' + page.municipality.canton.name + ' · Gemeng ' + page.municipality.name}"></p>
				<h2 th:text="${page.title}"></h2>
				<hr class="ornament">
			</header>
			<div class="prose" th:utext="${page.content}"></div>
			<nav class="turn" aria-label="Bliederen">
				<a class="previous" th:if="${previousPage}" th:href="@{/page/{p}(p=${previousPage.name})}"><span>← Virdrun</span><th:block th:text="${previousPage.title}"></th:block></a>
				<a class="next" th:if="${nextPage}" th:href="@{/page/{p}(p=${nextPage.name})}"><span>Duerno →</span><th:block th:text="${nextPage.title}"></th:block></a>
			</nav>
		</article>

		<aside class="marginalia">
			<section>
				<p sec:authorize="hasRole('ROLE_ADMIN')"><a class="edit-link" th:href="@{/admin/pageform(id=${page.id})}">Änneren</a></p>
				<h3>Informatiounen</h3>
				<dl class="facts">
					<dt>Gemeng</dt>
					<dd th:text="${page.municipality.name}"></dd>
					<dt>Kanton</dt>
					<dd th:text="${page.municipality.canton.name}"></dd>
					<dt>Distrikt</dt>
					<dd th:text="${page.municipality.canton.district.name}"></dd>
					<dt>Publizéiert</dt>
					<dd th:text="${#temporals.format(page.datePublished, 'dd.MM.yyyy')}"></dd>
				</dl>
			</section>
			<section class="location-map">
				<h3>Op der Landkaart</h3>
				<div id="map"></div>
			</section>
			<section class="nearby" th:unless="${#lists.isEmpty(nearbyPages)}">
				<h3>An der Géigend</h3>
				<ul>
					<li th:each="nearbyPage : ${nearbyPages}"><a th:href="@{/page/{page}(page=${nearbyPage.name})}" th:text="${nearbyPage.title}"></a><span class="distance" th:text="${#numbers.formatDecimal(nearbyPage.distance, 1, 1, 'COMMA') + ' km'}"></span></li>
				</ul>
			</section>
		</aside>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/

		var map = L.map("map").setView([49.85, 6.1], 8);
		L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
			maxZoom : 19,
			attribution : '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
		}).addTo(map);

		L.marker([ [[${page.latitude}]], [[${page.longitude}]] ], { title : [[${page.title}]] }).addTo(map);

		/*]]>*/
	</script>
</main>
</html>
