<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">
<head>
<title th:text="${'Sich no ''' + param.q + ''''}"></title>
</head>
<main layout:fragment="content">
	<div class="single">
		<article>
			<header class="chapter-head">
				<p class="kicker">Resultat vun der Sich</p>
				<h2 th:text="${'„' + param.q + '“'}"></h2>
				<hr class="ornament">
			</header>
			<th:block th:switch="${pages}">
				<div th:case="${null}">
					<p>Keng Säite fonnt.</p>
				</div>
				<div th:case="*">
					<ul class="results">
						<li th:each="page : ${pages}"><a th:href="@{/page/{p}(p=${page.name})}" th:text="${page.title}"></a></li>
					</ul>
				</div>
			</th:block>
		</article>
	</div>
</main>
</html>
